[tool.poetry]
name = "pwnproxy"
version = "0.1.0"
description = "Open source Burp Suite alternative for terminal"
authors = ["Eric Martinez"]
license = "AGPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
mitmproxy = "^12.2"
textual = "^8.2.7"
typer = "^0.25"
httpx = "^0.28"
fastapi = "^0.136"
uvicorn = {extras = ["standard"], version = "^0.47"}
sqlalchemy = "^2.0"
aiosqlite = "^0.22"
pyjwt = "^2.13"
rich = "^15.0"
websockets = "^16"
aiohttp = "^3.13"
    jinja2 = "^3.1"
    markdown = "^3.7"
    weasyprint = {version = "^63", optional = true}

[tool.poetry.extras]
reports-pdf = ["weasyprint"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
httpx = "^0.28"

[tool.poetry.scripts]
pwnproxy = "apps.terminal.cli:app"

[tool.pytest.ini_options]
markers = [
    "golden: end-to-end golden workflow tests (deselect with '-m not golden')",
    "live: tests against real targets (bWAPP + real LLM API), opt-in, never in CI",
    "perf: performance baseline test (opt-in via --perf-record/--perf-check)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"