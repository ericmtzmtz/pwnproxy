[tool.poetry]
name = "pwnproxy"
version = "0.2.0-dev"
description = "Local-first security testing engine with CLI, TUI, API, WebSocket, and MCP"
authors = ["Eric Martinez"]
license = "AGPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
mitmproxy = "^12.2"
textual = "^8.2.7"
typer = ">=0.25,<0.28"
httpx = "^0.28"
fastapi = ">=0.136,<0.142"
uvicorn = {extras = ["standard"], version = ">=0.47,<0.53"}
sqlalchemy = "^2.0"
aiosqlite = "^0.22"
pyjwt = "^2.13"
rich = "^15.0"
websockets = "^16"
aiohttp = "^3.13"
    jinja2 = "^3.1"
    markdown = "^3.7"
    weasyprint = {version = "^70", optional = true}

[tool.poetry.extras]
reports-pdf = ["weasyprint"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
httpx = "^0.28"

[tool.poetry.scripts]
pwnproxy = "apps.terminal.cli:app"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "golden: end-to-end golden workflow tests (deselect with '-m not golden')",
    "live: tests against real targets (bWAPP + real LLM API), opt-in, never in CI",
    "perf: performance baseline test (opt-in via --perf-record/--perf-check)",
    "flaky: known-intermittent test under investigation (still runs in CI; fix the root cause, do not deselect)",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Curated, reproducible rule set (ruff's built-in default is broad and
# version-dependent). Add rules deliberately, not by default.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends()/Query()/Body() in argument defaults is idiomatic
    "SIM117", # nested with-statements: explicit nesting is preferred here
    "UP042",  # str+Enum -> StrEnum changes str()/format semantics
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"