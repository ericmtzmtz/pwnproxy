version: 2
updates:
  # Python deps (Poetry-managed lockfile)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  # Web UI deps
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
